name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Explain missing Cloudflare secret
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Add CLOUDFLARE_API_TOKEN as a repository secret to enable automatic Cloudflare deploys."

      - name: Deploy with Wrangler
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: 27ef0325335953c13fc6770b9800720d
          wranglerVersion: "4"
          command: deploy
